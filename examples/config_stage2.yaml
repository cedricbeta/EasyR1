data:
  train_files: /home/chendong/video-rl/qwen-sft/qwen-vl-sft/videomme_two_stage_separate.json
  val_files: /home/chendong/video-rl/qwen-sft/qwen-vl-sft/videomme_two_stage_separate.json
  prompt_key: prompt
  answer_key: answer
  video_key: videos
  stage: 2  # Stage 2: answer generation with clipped video
  video_fps: 2.0
  max_prompt_length: 2048
  max_response_length: 1024
  rollout_batch_size: 256
  mini_rollout_batch_size: null
  val_batch_size: 512
  format_prompt: null
  override_chat_template: null
  shuffle: true
  seed: 1
  min_pixels: 262144
  max_pixels: 4194304  # Lower for 32 frames
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99

worker:
  actor:
    global_batch_size: 128
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 2
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: Qwen/Qwen2.5-VL-7B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 5.0e-7
      weight_decay: 1.0e-2
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true

  rollout:
    n: 4  # Generate 4 responses for GRPO
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    gpu_memory_utilization: 0.6
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 2
    disable_tqdm: false
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_type: batch
    reward_function: ./examples/reward_function/videomme.py:compute_score_stage2

trainer:
  total_epochs: 8
  max_steps: null
  project_name: videomme_two_stage
  experiment_name: stage2_answer_generation
  logger: ["console", "wandb"]
  nnodes: 1
  n_gpus_per_node: 8
  max_try_make_batch: 20
  val_freq: 2
  val_before_train: true
  val_only: false
  val_generations_to_log: 3
  save_freq: 2
  save_limit: 3
  save_model_only: false
  save_checkpoint_path: null
  load_checkpoint_path: null  # Will be set to stage 1 checkpoint path
  find_last_checkpoint: true